<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Расшифровка символов</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scene">
    <img class="gate-bg" src="images/ФОН-День-1.png" />

    <div class="symbols-layer">
      <div class="symbol-wrap sym-left">
        <span class="hint">Ты</span>
        <img class="glyph" src="images/1-glyph.svg" />
      </div>

      <div class="symbol-wrap sym-center">
        <span class="hint">всё</span>
        <img class="glyph" src="images/2-glyph.svg" />
      </div>

      <div class="symbol-wrap sym-right">
        <span class="hint">сможешь</span>
        <img class="glyph" src="images/Копия 3-glyph.svg" />
      </div>
    </div>

    <div class="final-message" id="finalMessage">Ты всё сможешь!</div>

    <button id="scanBtn" class="scan-btn">Сканировать символы</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
